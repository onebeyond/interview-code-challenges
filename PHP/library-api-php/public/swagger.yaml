openapi: 3.0.0
info:
  title: One Beyond Library API
  description: Architectural implementation of the Library API challenge. Features immutable domain models, an anti-corruption layer for legacy data, and strict TDD business logic.
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Local Docker Environment

paths:
  /books:
    get:
      summary: Get all books
      responses:
        '200':
          description: A list of books
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Book'

  /loans:
    get:
      summary: List all active loans
      responses:
        '200':
          description: A list of active book stocks currently on loan
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookStock'

  /loans/return:
    post:
      summary: Return a book
      description: Returns a book and automatically calculates/generates any applicable overdue fines.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                bookStockId:
                  type: integer
                  example: 1
      responses:
        '200':
          description: Book returned successfully
        '400':
          description: Domain Rule Violation (e.g., book not on loan)

  /reservations:
    post:
      summary: Reserve a book
      description: Places a borrower in the queue for a book stock that is currently on loan.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                bookStockId:
                  type: integer
                  example: 1
                borrowerId:
                  type: integer
                  example: 2
      responses:
        '200':
          description: Book successfully reserved
        '400':
          description: Domain Rule Violation (e.g., book is not currently on loan)

  /reservations/status:
    get:
      summary: Check reservation status
      description: Calculates the queue position and estimated availability date based on a 14-day standard loan period.
      parameters:
        - in: query
          name: bookStockId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Queue status and estimated date
          content:
            application/json:
              schema:
                type: object
                properties:
                  queue_length:
                    type: integer
                    example: 2
                  estimated_availability:
                    type: string
                    format: date
                    example: '2025-04-24'

components:
  schemas:
    Book:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        authorId:
          type: integer
        format:
          type: string
        isbn:
          type: string
    BookStock:
      type: object
      properties:
        id:
          type: integer
        bookId:
          type: integer
        isOnLoan:
          type: boolean
        loanEndDate:
          type: string
          format: date-time
        borrowerId:
          type: integer